name: Release
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
        - stable
        - preview
        default: stable
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      app:
        description: Optional app ID; empty selects every advanced app
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@e219396d4dcab9a14c9d7ee1730320fc94006dcc
    with:
      toolkit-ref: e219396d4dcab9a14c9d7ee1730320fc94006dcc
      channel: ${{ inputs.channel }}
      app: ${{ inputs.app }}
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.plan.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - run: npm ci
    - run: npm test
    - run: |
        npm run build
        npm run build:nugget
        npm pack --ignore-scripts
    - shell: bash
      run: |
        mkdir package-output
        mv ./*.tgz package-output/
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: JX-Holdings-LLC/release-infrastructure
        ref: e219396d4dcab9a14c9d7ee1730320fc94006dcc
        path: .toolkit
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - name: Stage the complete configured release inventory
      shell: bash
      env:
        RELEASE_APP: ai-nugget
      run: node .toolkit/src/release.mjs stage --app "$RELEASE_APP" --from package-output --bundle unified-bundle
        --sha "$RELEASE_SOURCE_SHA"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bundle-ai-nugget
        path: unified-bundle
        if-no-files-found: error
    needs:
    - plan
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['ai-nugget'].selected
    env:
      RELEASE_TAG: ${{ fromJSON(needs.plan.outputs.apps)['ai-nugget'].tag }}
      RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['ai-nugget'].version }}
      RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
  publish-npm:
    runs-on: ubuntu-latest
    needs:
    - plan
    - build
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['ai-nugget'].selected
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        scope: '@jxburros'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: bundle-ai-nugget
        path: package-output
    - name: Publish the prebuilt package (or dry run)
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        PACKAGE_NAME: '@jxburros/ai-nugget'
        PACKAGE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['ai-nugget'].version }}
        REGISTRY: https://registry.npmjs.org
        DRY_RUN: ${{ inputs.dry_run }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        file=$(find package-output -maxdepth 1 -name '*.tgz' -print -quit)
        if [ "$DRY_RUN" = true ]; then
          npm publish "$file" --ignore-scripts --access public --registry="$REGISTRY" --dry-run
          exit 0
        fi
        if remote=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --registry="$REGISTRY" 2>/dev/null); then
          local=$(node -e 'const fs=require("fs"),c=require("crypto");console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$file")
          [ "$remote" = "$local" ] || { echo "Existing registry version has different bytes"; exit 1; }
          echo "Identical package already published; continuing the interrupted release."
          exit 0
        fi
        tag=latest
        [ "$RELEASE_CHANNEL" != preview ] || tag=next
        args=(--ignore-scripts --access public --registry="$REGISTRY" --tag="$tag")
        if [ "$REGISTRY" = https://registry.npmjs.org ]; then args+=(--provenance); fi
        npm publish "$file" "${args[@]}"
  publish-github:
    runs-on: ubuntu-latest
    needs:
    - plan
    - build
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['ai-nugget'].selected
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com
        scope: '@jxburros'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: bundle-ai-nugget
        path: package-output
    - name: Publish the prebuilt package (or dry run)
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        PACKAGE_NAME: '@jxburros/ai-nugget'
        PACKAGE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['ai-nugget'].version }}
        REGISTRY: https://npm.pkg.github.com
        DRY_RUN: ${{ inputs.dry_run }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        file=$(find package-output -maxdepth 1 -name '*.tgz' -print -quit)
        if [ "$DRY_RUN" = true ]; then
          npm publish "$file" --ignore-scripts --access public --registry="$REGISTRY" --dry-run
          exit 0
        fi
        if remote=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" dist.integrity --registry="$REGISTRY" 2>/dev/null); then
          local=$(node -e 'const fs=require("fs"),c=require("crypto");console.log("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$file")
          [ "$remote" = "$local" ] || { echo "Existing registry version has different bytes"; exit 1; }
          echo "Identical package already published; continuing the interrupted release."
          exit 0
        fi
        tag=latest
        [ "$RELEASE_CHANNEL" != preview ] || tag=next
        args=(--ignore-scripts --access public --registry="$REGISTRY" --tag="$tag")
        if [ "$REGISTRY" = https://registry.npmjs.org ]; then args+=(--provenance); fi
        npm publish "$file" "${args[@]}"
  publish-ai-nugget:
    needs:
    - plan
    - build
    - publish-npm
    - publish-github
    if: needs.plan.outputs.selected == 'true' && fromJSON(needs.plan.outputs.apps)['ai-nugget'].selected
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@e219396d4dcab9a14c9d7ee1730320fc94006dcc
    permissions:
      contents: write
    with:
      toolkit-ref: e219396d4dcab9a14c9d7ee1730320fc94006dcc
      source-sha: ${{ needs.plan.outputs.sha }}
      app: ai-nugget
      security: standard
      artifact: bundle-ai-nugget
      dry-run: ${{ inputs.dry_run }}
