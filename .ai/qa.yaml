schema_version: 3
kind: qa_levels_template
project:
  name: AI Nugget
  app_type: Isomorphic TypeScript library
  default_branch: main
  package_manager: npm
  node_version: "22"
levels:
  - level: 1
    name: install
    display_name: Install
    description: Run the repository-defined install check.
    tools: [node, npm]
    commands:
      - id: install
        run: npm ci
        required: true
        success: {exit_code: 0}
        failure: {exit_code_not: 0}
    pass_when: [Command exits zero]
    fail_when: [Command exits nonzero]
    warn_when: []
    skip_when: []
    blocked_when: [Required tools or browser dependencies unavailable]
    evidence:
      capture: [command, exit_code, stdout, stderr]
      write_to: [qa-report.md, qa-results.json]
  - level: 2
    name: node_contracts
